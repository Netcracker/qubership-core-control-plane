# Go Build Workflow
#
# Builds, tests Go projects with SonarQube analysis and Docker image creation.
# Uses generic-go-build.yaml for the actual build process.
#
# Triggers:
#   - Push to lts/26.1 branch
#   - Pull requests
#
# See generic-go-build.yaml for full documentation on build features and required secrets/vars.

name: Build

run-name: >
  Build Go Service —
  ${{ github.event_name }} (${{ github.head_ref || github.ref_name }}) —
  [${{ github.event_name == 'push' && format('{0}', github.event.head_commit.message) || '' }}
  ${{ github.event_name == 'pull_request' && format('{0}', github.event.pull_request.title) || '' }}]

on:
  push:
    branches:
      - lts/26.1
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build-test-service:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and load test-service image
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: |
            ghcr.io/netcracker/cp-test-service:latest
        context: ./
        file: ./control-plane-test-service/Dockerfile
        platforms: linux/amd64


  build:
    name: Build and test
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@71206242f5967ac6691337913593f8623863f711 # v2.5.2
    with:
      go-module-dir: control-plane
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
    secrets: inherit
