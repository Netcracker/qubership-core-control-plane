# Go Build Workflow
#
# Builds, tests Go projects with SonarQube analysis and Docker image creation.
# Uses generic-go-build.yaml for the actual build process.
#
# Triggers:
#   - Push to main or an lts/** branch
#   - Pull requests
#
# See generic-go-build.yaml for full documentation on build features and required secrets/vars.

name: Build

run-name: >
  Build —
  ${{ github.event_name == 'push' && format('push [{0}]', github.event.head_commit.message) || '' }}
  ${{ github.event_name == 'pull_request' && format('PR ({0}) [{1}]', github.head_ref, github.event.pull_request.title) || '' }}

on:
  push:
    paths-ignore:
      - 'httproute-generator/**'
    branches:
      - main
      - 'lts/**'
  pull_request:
    paths-ignore:
      - 'httproute-generator/**'
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and test
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@5b516cb72575ea935d4be52c163b353f74c40e67 # experiment/self-repo-workflow-refs
    with:
      go-module-dir: control-plane
      dry-run: true
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
    secrets: inherit
