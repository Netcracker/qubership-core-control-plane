# 1. Core creates deny-unless-permit AuthorizationPolicy for public gateway
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: public-gateway-deny-unless-permit
  namespace: core-dev-1
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
  action: ALLOW
  rules:
    - to:
        - operation:
            paths:
              - /**
---
# 2a. HTTPRoute of migrated microservice
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mesh-app-allow-deny-test-routes
  namespace: core-dev-1
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/mesh-app-pub
      backendRefs:
        - name: mesh-app
          port: 8080
          weight: 1
---
# 2b. Microservice brings its AuthorizationPolicy
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mesh-app-public-allow
  namespace: core-dev-1
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
  action: ALLOW
  rules:
    - to:
        - operation:
            methods: ["GET"]
            paths:
              - /api/v1/mesh-app-pub/public/*
              - /api/v1/mesh-app-pub/health
---
# 3a. Allow more (project): expand what 2b allowed.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mesh-app-public-allow-override
  namespace: core-dev-1
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
  action: ALLOW
  rules:
    - to:
        - operation:
            methods: ["GET"]
            paths:
              - /api/v1/mesh-app-pub/private/*
---
# 3b. Deny more (project): narrow what 2b allowed.
# DENY is evaluated before ALLOW, so it wins even over the allow above.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mesh-app-public-deny-override
  namespace: core-dev-1
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
  action: DENY
  rules:
    - to:
        - operation:
            paths:
              - /api/v1/mesh-app-pub/public/secret*