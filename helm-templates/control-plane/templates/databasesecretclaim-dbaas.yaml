{{- if include "coretpl.dbaasOperatorEnabled" $ }}
---
apiVersion: dbaas.netcracker.com/v1
kind: DatabaseSecretClaim
metadata:
    name: 'control-plane-postgresql-service-default-claim'
    namespace: '{{ .Values.NAMESPACE }}'
    labels:
        app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
        app.kubernetes.io/part-of: 'Cloud-Core'
        app.kubernetes.io/managed-by: 'saasDeployer'
        deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
spec:
    operatorNamespace: {{ include "coretpl.dbaasOperatorNamespace" $ | quote }}
    classifier:
        microserviceName: '{{ .Values.SERVICE_NAME }}'
        namespace: '{{ .Values.NAMESPACE }}'
        scope: 'service'
    type: 'postgresql'
    # userRole is omitted: buildServiceDbParams in control-plane/db/dbprovider.go leaves BaseDbParams
    # at its zero value, so the client requests the empty role. Empty and "admin" are different lookup keys.
    secretName: 'control-plane-postgresql-service-default-credentials'
{{- end }}
