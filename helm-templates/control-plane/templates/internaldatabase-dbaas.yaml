{{- if .Capabilities.APIVersions.Has "dbaas.netcracker.com/v1" }}
---
apiVersion: dbaas.netcracker.com/v1
kind: InternalDatabase
metadata:
    name: 'control-plane-postgresql-service-db'
    namespace: '{{ .Values.NAMESPACE }}'
    labels:
        app.kubernetes.io/name: 'control-plane'
        app.kubernetes.io/part-of: 'Cloud-Core'
        app.kubernetes.io/managed-by: 'saasDeployer'
        deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
spec:
    operatorNamespace: {{ (index (splitList "." (first (splitList ":" (last (splitList "://" $.Values.API_DBAAS_ADDRESS))))) 1) | quote }}
    # The classifier is a literal copy of createControlPlaneServiceClassifier in control-plane/db/dbprovider.go:
    # microserviceName is hard-coded in Go, so it is not templated from SERVICE_NAME.
    classifier:
        microserviceName: 'control-plane'
        namespace: '{{ .Values.NAMESPACE }}'
        scope: 'service'
    type: 'postgresql'
{{- end }}
