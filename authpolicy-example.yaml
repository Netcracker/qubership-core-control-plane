# 1. HTTPRoute: forward everything under /api/v1/mesh-app-pub to mesh-app:8080
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mesh-app-allow-deny-test-routes
  namespace: core-dev-1
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private-gateway
    - group: ''
      kind: Service
      name: internal-gateway-service
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/mesh-app-pub
      backendRefs:
        - name: mesh-app
          port: 8080
          weight: 1
---
# 2a. Deny-unless-permit (Cloud-Core / core-mesh-config).
# ALLOW with no rules matches nothing, so every request is rejected unless
# another ALLOW policy permits it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: public-gateway-deny-unless-permit
  namespace: core-dev-1
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
  action: ALLOW
  # no rules => nothing is allowed
---
# 2b. Microservice OOB opens a subset of routes.
# Only GET /api/v1/mesh-app-pub/public/* and exactly /api/v1/mesh-app-pub/health
# become reachable.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mesh-app-public-allow
  namespace: core-dev-1
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
  action: ALLOW
  rules:
    - to:
        - operation:
            methods: ["GET"]
            paths:
              - /api/v1/mesh-app-pub/public/*
              - /api/v1/mesh-app-pub/health
---
# 3a. Allow more (project): expand what 2b allowed.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mesh-app-public-allow-override
  namespace: core-dev-1
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
  action: ALLOW
  rules:
    - to:
        - operation:
            methods: ["GET"]
            paths:
              - /api/v1/mesh-app-pub/private/*
---
# 3b. Deny more (project): narrow what 2b allowed.
# DENY is evaluated before ALLOW, so it wins even over the allow above.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mesh-app-public-deny-override
  namespace: core-dev-1
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
  action: DENY
  rules:
    - to:
        - operation:
            paths:
              - /api/v1/mesh-app-pub/public/secret*