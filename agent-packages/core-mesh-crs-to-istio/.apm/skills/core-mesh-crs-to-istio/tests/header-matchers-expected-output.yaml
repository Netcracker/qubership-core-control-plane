# Rules are sorted by path specificity, so the order differs from the input.
{{- if eq .Values.SERVICE_MESH_TYPE "Istio" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: header-matchers
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public-gateway
  rules:
  # ⚠ MANUAL REVIEW: x-debug used invertMatch, which Gateway API cannot express.
  # The header match is dropped, so this rule now matches requests the original
  # excluded — narrow it by hand or split the route.
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/inverted
    backendRefs:
    - kind: Service
      name: echo
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/present
      headers:
      - name: x-tenant
        type: RegularExpression
        value: .*
    backendRefs:
    - kind: Service
      name: echo
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/prefix
      headers:
      - name: x-version
        type: RegularExpression
        value: v1\.2.*
    backendRefs:
    - kind: Service
      name: echo
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/suffix
      headers:
      - name: x-origin
        type: RegularExpression
        value: .*\.internal
    backendRefs:
    - kind: Service
      name: echo
      port: 8080
  # ⚠ MANUAL REVIEW: x-weight used rangeMatch [1,10), which has no Gateway API
  # equivalent. The header match is dropped, widening this rule.
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/range
    backendRefs:
    - kind: Service
      name: echo
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /api/v1/regex
      headers:
      - name: x-trace
        type: RegularExpression
        value: "[0-9a-f]{8}"
    backendRefs:
    - kind: Service
      name: echo
      port: 8080
{{- end }}
