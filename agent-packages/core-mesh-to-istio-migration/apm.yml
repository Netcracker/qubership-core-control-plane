name: core-mesh-to-istio-migration
version: 3.0.1
description: Orchestrates the full Cloud-Core Mesh to Istio migration end-to-end — converts declarative mesh CRs to Gateway API, migrates route-registration libraries, wires SERVICE_MESH_TYPE, generates HTTPRoutes from code, validates Istio guards / duplicate rules / access control / imperative control-plane calls, recommends (and, on request, drafts) the public-gateway AuthorizationPolicy, and maintains .mesh-migration/MIGRATION_LOG.md.
author: Qubership
dependencies:
  apm:
    - ../core-mesh-crs-to-istio
    - ../mesh-build-wiring
    - ../httproute-from-code
    - ../istio-migration-validate
    - ../public-gateway-authz-policy
