name: core-mesh-to-istio-migration
version: 2.0.0
description: Orchestrates the full Cloud-Core Mesh to Istio migration end-to-end — converts declarative mesh CRs to Gateway API, migrates route-registration libraries, wires SERVICE_MESH_TYPE, generates HTTPRoutes from code, validates Istio guards / duplicate rules / imperative control-plane calls, and maintains .mesh-migration/MIGRATION_LOG.md.
author: Qubership
dependencies:
  apm:
    - ../core-mesh-crs-to-istio
    - ../mesh-build-wiring
    - ../httproute-from-code
    - ../istio-migration-validate
