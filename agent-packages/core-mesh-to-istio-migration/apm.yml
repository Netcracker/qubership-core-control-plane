name: core-mesh-to-istio-migration
version: 2.2.0
description: Orchestrates the full Cloud-Core Mesh to Istio migration end-to-end — converts declarative mesh CRs to Gateway API (path-variable routes cut to PathPrefix, forbidden routes to AuthorizationPolicy DENY), migrates route-registration libraries, wires SERVICE_MESH_TYPE, generates HTTPRoutes from code, validates Istio guards / duplicate rules / DENY overlaps / imperative control-plane calls, and maintains .mesh-migration/MIGRATION_LOG.md.
author: Qubership
dependencies:
  apm:
    - ../core-mesh-crs-to-istio
    - ../mesh-build-wiring
    - ../httproute-from-code
    - ../istio-migration-validate
