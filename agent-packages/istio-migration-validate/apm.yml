name: istio-migration-validate
version: 1.2.0
description: Validate the output of a Core Mesh to Istio migration — Istio guards on every HTTPRoute / AuthorizationPolicy file, no leakage under Core mode, duplicate HTTPRoute rule detection across declarative, annotation-generated, and code-generated routes, DENY rules that block another source's routes, and detection of imperative control-plane API calls in scripts.
author: Qubership
